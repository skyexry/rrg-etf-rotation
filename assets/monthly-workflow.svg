<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Monthly research and execution workflow</title>
  <desc id="desc">A flowchart showing month-end information, four portfolio strategies, sector-to-ETF mapping, next-open execution, and monthly evaluation.</desc>
  <defs>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif; fill: #17324d; }
      .muted { fill: #60758a; }
      .title { font-size: 34px; font-weight: 720; letter-spacing: -.4px; }
      .step { font-size: 23px; font-weight: 680; }
      .cardtitle { font-size: 21px; font-weight: 680; }
      .body { font-size: 17px; }
      .line { fill: none; stroke: #294967; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#294967"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#fbfcfe"/>
  <text class="t title" x="70" y="58">Monthly research and execution workflow</text>
  <text class="t muted body" x="70" y="88">Four strategies share one information set, trading convention, and cost model.</text>

  <rect x="236" y="118" width="728" height="92" rx="18" fill="#edf3f9" stroke="#d7e1ea"/>
  <text class="t step" x="600" y="154" text-anchor="middle">1 · Form the month-end information set</text>
  <text class="t muted body" x="600" y="184" text-anchor="middle">Sector prices · stock breadth · eligible ETFs · disclosed holdings</text>

  <path class="line" d="M600 210 V242 M148 242 H1052 M148 242 V270 M449 242 V270 M751 242 V270 M1052 242 V270" marker-end="url(#arrow)"/>

  <g class="t" text-anchor="middle">
    <rect x="54" y="270" width="188" height="174" rx="16" fill="#eaf7f1" stroke="#cfe5da"/>
    <text class="cardtitle" x="148" y="310">Q · Pure RRG</text>
    <text class="body" x="148" y="345">Select leading sectors</text>
    <text class="body" x="148" y="371">using relative trend</text>
    <text class="body" x="148" y="397">and momentum</text>
    <text class="t muted body" x="148" y="426">up to 6 sectors</text>

    <rect x="355" y="270" width="188" height="174" rx="16" fill="#eef4fb" stroke="#d7e1ea"/>
    <text class="cardtitle" x="449" y="310">C · Breadth + RRG</text>
    <text class="body" x="449" y="345">Rank stock breadth,</text>
    <text class="body" x="449" y="371">then retain leading</text>
    <text class="body" x="449" y="397">or improving sectors</text>
    <text class="t muted body" x="449" y="426">top 6 candidates</text>

    <rect x="657" y="270" width="188" height="174" rx="16" fill="#eef4fb" stroke="#d7e1ea"/>
    <text class="cardtitle" x="751" y="310">M · Momentum</text>
    <text class="body" x="751" y="345">Rank sector returns</text>
    <text class="body" x="751" y="371">over the previous</text>
    <text class="body" x="751" y="397">220 trading days</text>
    <text class="t muted body" x="751" y="426">top 6 sectors</text>

    <rect x="958" y="270" width="188" height="174" rx="16" fill="#f2f4f7" stroke="#d7e1ea"/>
    <text class="cardtitle" x="1052" y="310">E · Equal weight</text>
    <text class="body" x="1052" y="345">Allocate capital evenly</text>
    <text class="body" x="1052" y="371">across the eligible</text>
    <text class="body" x="1052" y="397">ETF universe</text>
    <text class="t muted body" x="1052" y="426">direct benchmark</text>
  </g>

  <path class="line" d="M148 444 V476 H751 V500 M449 444 V500 M751 444 V500"/>
  <rect x="220" y="500" width="662" height="104" rx="18" fill="#edf3f9" stroke="#d7e1ea"/>
  <text class="t step" x="551" y="540" text-anchor="middle">2 · Map selected sectors into ETF portfolios</text>
  <text class="t muted body" x="551" y="571" text-anchor="middle">Use disclosed holdings to estimate sector exposure and solve portfolio weights</text>

  <path class="line" d="M551 604 V655 H600" marker-end="url(#arrow)"/>
  <path class="line" d="M1052 444 V655 H914" marker-end="url(#arrow)"/>

  <rect x="236" y="655" width="728" height="96" rx="18" fill="#edf3f9" stroke="#d7e1ea"/>
  <text class="t step" x="600" y="694" text-anchor="middle">3 · Rebalance at the next trading-day open</text>
  <text class="t muted body" x="600" y="724" text-anchor="middle">Sell existing positions, then buy target weights · 3 bp per purchase and sale</text>

  <path class="line" d="M600 751 V786" marker-end="url(#arrow)"/>
  <rect x="312" y="786" width="576" height="72" rx="18" fill="#ffffff" stroke="#c8d5e1"/>
  <text class="t step" x="600" y="819" text-anchor="middle">4 · Hold until the next month-end</text>
  <text class="t muted body" x="600" y="845" text-anchor="middle">Record return, risk, turnover, and drawdown for Q / C / M / E</text>
</svg>
