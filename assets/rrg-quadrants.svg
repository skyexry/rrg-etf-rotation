<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RRG quadrant map</title>
  <desc id="desc">A professional diagram explaining the Leading, Improving, Lagging, and Weakening quadrants of a Relative Rotation Graph.</desc>
  <defs>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Arial, sans-serif; fill: #17324d; }
      .muted { fill: #60758a; }
      .small { font-size: 17px; }
      .body { font-size: 21px; }
      .label { font-size: 23px; font-weight: 650; letter-spacing: .2px; }
      .title { font-size: 34px; font-weight: 720; letter-spacing: -.4px; }
      .axis { stroke: #17324d; stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#fbfcfe"/>
  <text class="t title" x="72" y="62">RRG quadrant map</text>
  <text class="t muted body" x="72" y="94">Relative strength × relative momentum</text>

  <rect x="96" y="132" width="504" height="240" rx="18" fill="#eef4fb"/>
  <rect x="600" y="132" width="504" height="240" rx="18" fill="#eaf7f1"/>
  <rect x="96" y="372" width="504" height="240" rx="18" fill="#f2f4f7"/>
  <rect x="600" y="372" width="504" height="240" rx="18" fill="#fff3e5"/>

  <line class="axis" x1="76" y1="372" x2="1128" y2="372" marker-end="url(#arrow)"/>
  <line class="axis" x1="600" y1="634" x2="600" y2="112" marker-end="url(#arrow)"/>
  <circle cx="600" cy="372" r="7" fill="#17324d"/>

  <g class="t" text-anchor="middle">
    <rect x="170" y="153" width="244" height="40" rx="20" fill="#ffffff" opacity=".96"/>
    <text class="small" x="292" y="179">Composite strategy also includes</text>
    <text class="label" x="348" y="245">Improving</text>
    <text class="body" x="348" y="282">Relative trend is weak</text>
    <text class="body" x="348" y="314">but gaining momentum</text>

    <rect x="786" y="153" width="244" height="40" rx="20" fill="#ffffff" opacity=".96"/>
    <text class="small" x="908" y="179">Pure RRG selects from here</text>
    <text class="label" x="852" y="245">Leading</text>
    <text class="body" x="852" y="282">Relative trend is strong</text>
    <text class="body" x="852" y="314">and still gaining momentum</text>

    <text class="label" x="348" y="475">Lagging</text>
    <text class="body" x="348" y="512">Relative trend is weak</text>
    <text class="body" x="348" y="544">and still losing momentum</text>

    <text class="label" x="852" y="475">Weakening</text>
    <text class="body" x="852" y="512">Relative trend is strong</text>
    <text class="body" x="852" y="544">but momentum is fading</text>
  </g>

  <text class="t muted small" x="614" y="399">benchmark = (100, 100)</text>
  <text class="t muted small" x="96" y="666">weaker relative trend</text>
  <text class="t muted small" x="1104" y="666" text-anchor="end">stronger relative trend</text>
  <text class="t muted small" x="620" y="124">stronger relative momentum</text>
  <text class="t muted small" x="620" y="636">weaker relative momentum</text>
  <text class="t muted small" x="600" y="700" text-anchor="middle">Horizontal: RS-Ratio · Vertical: RS-Momentum</text>
</svg>
