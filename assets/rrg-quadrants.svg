<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">RRG 四象限图</title>
  <desc id="desc">专业呈现相对旋转图中的领先、改善、滞后和疲软四个象限。</desc>
  <defs>
    <style>
      .t { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #17324d; }
      .muted { fill: #60758a; }
      .small { font-size: 17px; }
      .body { font-size: 21px; }
      .label { font-size: 23px; font-weight: 650; letter-spacing: .2px; }
      .title { font-size: 34px; font-weight: 720; letter-spacing: -.4px; }
      .axis { stroke: #17324d; stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#17324d"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#fbfcfe"/>
  <text class="t title" x="72" y="62">RRG 四象限图</text>
  <text class="t muted body" x="72" y="94">相对趋势强度 × 相对趋势动能</text>

  <rect x="96" y="132" width="504" height="240" rx="18" fill="#eef4fb"/>
  <rect x="600" y="132" width="504" height="240" rx="18" fill="#eaf7f1"/>
  <rect x="96" y="372" width="504" height="240" rx="18" fill="#f2f4f7"/>
  <rect x="600" y="372" width="504" height="240" rx="18" fill="#fff3e5"/>

  <line class="axis" x1="76" y1="372" x2="1128" y2="372" marker-end="url(#arrow)"/>
  <line class="axis" x1="600" y1="634" x2="600" y2="112" marker-end="url(#arrow)"/>
  <circle cx="600" cy="372" r="7" fill="#17324d"/>

  <g class="t" text-anchor="middle">
    <rect x="170" y="153" width="244" height="40" rx="20" fill="#ffffff" opacity=".96"/>
    <text class="small" x="292" y="179">复合策略也纳入这里</text>
    <text class="label" x="348" y="245">第二象限 · 改善</text>
    <text class="body" x="348" y="282">相对趋势偏弱</text>
    <text class="body" x="348" y="314">但动能正在增强</text>

    <rect x="786" y="153" width="244" height="40" rx="20" fill="#ffffff" opacity=".96"/>
    <text class="small" x="908" y="179">纯 RRG 重点关注</text>
    <text class="label" x="852" y="245">第一象限 · 领先</text>
    <text class="body" x="852" y="282">相对趋势较强</text>
    <text class="body" x="852" y="314">而且动能仍在增强</text>

    <text class="label" x="348" y="475">第三象限 · 滞后</text>
    <text class="body" x="348" y="512">相对趋势偏弱</text>
    <text class="body" x="348" y="544">而且动能继续减弱</text>

    <text class="label" x="852" y="475">第四象限 · 疲软</text>
    <text class="body" x="852" y="512">相对趋势较强</text>
    <text class="body" x="852" y="544">但动能正在减弱</text>
  </g>

  <text class="t muted small" x="614" y="399">基准点 = (100, 100)</text>
  <text class="t muted small" x="96" y="666">相对趋势较弱</text>
  <text class="t muted small" x="1104" y="666" text-anchor="end">相对趋势较强</text>
  <text class="t muted small" x="620" y="124">相对动能增强</text>
  <text class="t muted small" x="620" y="636">相对动能减弱</text>
  <text class="t muted small" x="600" y="700" text-anchor="middle">横轴：RS-Ratio · 纵轴：RS-Momentum</text>
</svg>
